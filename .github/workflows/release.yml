name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$version" ]; then
            echo "Tag ($tag) does not match manifest.json version ($version)"
            exit 1
          fi

      - name: Build reminders-cli helper (universal binary)
        run: bash build-swift.sh

      - name: Lint
        run: npm run lint

      - name: Build plugin
        run: npm run build

      - name: Package CLI helper
        run: |
          mkdir -p dist/bin
          cp bin/reminders-cli dist/bin/reminders-cli
          chmod +x dist/bin/reminders-cli
          (cd dist && zip -r ../reminders-cli-macos-universal.zip bin)

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            main.js manifest.json styles.css reminders-cli-macos-universal.zip
